name: Database regression
on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/database-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: bandanize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d bandanize_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: HTTP and database lifecycle on PostgreSQL
        working-directory: apps/backend
        run: |
          chmod +x mvnw
          ./mvnw test -Dtest=DatabaseLifecycleTest,TabCommentHttpTest \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/bandanize_test \
            -Dspring.datasource.driverClassName=org.postgresql.Driver \
            -Dspring.datasource.username=audit -Dspring.datasource.password=audit \
            -Dspring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect \
            -Dspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
